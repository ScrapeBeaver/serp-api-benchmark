           limits: {requests_per_hour: 640000}}
      # Out of searches: HTTP 429 by default. With the opt-in "Automatic Early Renewal" (or a
      # manual renewal) the same plan is bought again at full price and the cycle restarts.
      # There is no per-search overage. `auto_renew` is recorded because it is a published
      # way to buy more searches within a month; the Free plan is left at `block`.
      on_limit: auto_renew
      overage: null
      free: {units: 250, period: month, notes: "The Free plan: 50 searches an hour."}
      addons:
        - name: Ludicrous Speed
          price_multiply: 2
          notes: >
            "2x base price"; "Uses 2x the server resources". Switched on for the plan or
            account, not per request: it multiplies the price of the plan, not the searches
            a request uses.
          source: https://serpapi.com/ludicrous-speed
        - name: Ludicrous Speed Max
          price_multiply: 4
          notes: '"4x base price". "Every plan can be combined with a speed mode."'
          source: https://serpapi.com/pricing
      beyond_published: >
        "For enterprise or custom volume plans, contact contact@serpapi.com."
        (https://serpapi.com/pricing). The enterprise page describes a different structure:
        $3,750 a month with 100,000 complimentary searches, and searches billed on top per
        1,000: $7.50 on demand or $2.75 reserved, on prepaid or postpaid invoices
        (https://serpapi.com/enterprise).
      refunds: >
        "We offer a full refund within 7 days of the date you subscribed to a plan unless
        you've used more than 20% of your searches."

    conflicts:
      - topic: What $3,750 a month buys
        statements:
          - text: "Cloud 1M: $3,750 a month with 1,000,000 searches included."
            source: https://serpapi.com/pricing
          - text: >-
              "Our Enterprise plan is priced at $3,750 per month. Searches are billed in
              addition according to your usage."
            source: https://serpapi.com/enterprise
        used: >
          The plan ladder of the pricing page. The two pages do not reconcile the two
          structures; the enterprise one is described under `beyond_published` and is not
          priced here.
      - topic: Who gets ZeroTrace
        statements:
          - text: "The plan table includes ZeroTrace from Cloud 1M upwards."
            source: https://serpapi.com/pricing
          - text: "The API documentation labels the `zero_trace` parameter 'Enterprise only'."
            source: https://serpapi.com/search-api
        used: >
          Neither changes a price: no surcharge is stated, and the benchmark does not send
          `zero_trace`.

    benchmark_account:
      plan: unknown
    notes: >
      Not expressed by a field. (1) With Ludicrous Speed the enterprise plan includes
      50,000 complimentary searches and costs $15.00 on demand or $5.50 reserved per 1,000;
      with Ludicrous Speed Max 25,000, $30.00 and $11.00. (2) A downgrade moves the old
      plan's remaining searches to a second balance, "Extra Credits", whose expiry is not
      stated. (3) An upgrade costs the difference between the two plans and keeps the
      renewal date. (4) After a cancellation the remaining searches can be used until the
      renewal date. (5) "Unused search credits don't roll over from month to month" is said
      on the enterprise page; the pricing page says only that searches reset. (6) Service
      credits under the SLA: "up to 100% of the monthly price of your plan on your next
      invoice". (7) Legal Shield comes with Production and larger plans. (8) `async` has no
      stated price difference; the documentation says not to use it together with
      `no_cache` or on an account with Ludicrous Speed. (9) A per-second or concurrency
      limit is not stated.

