# Worked example: a monthly subscription that buys a number of searches, on a long plan
# ladder (62 published plans). It also shows a speed tier sold as a multiplier on the plan
# price (`addons`), an hourly cap tied to the plan, a one-hour cache that has to be switched
# off, and a plan that is bought again early when it runs out (`on_limit: auto_renew`).
#
# Every fact comes from research/pricing/group-a.md (section 1), read on 2026-11-12.
# Not checked against the live service.

schema_version: 1
id: serpapi
name: SerpApi
status: draft
homepage: https://serpapi.com
docs_url: https://serpapi.com/search-api

product:
  name: Google Search API
  endpoint: "GET https://serpapi.com/search"
  mode: light                       # the benchmarked mode; SerpApi's own name for it is `engine=google`
  settings: {engine: google, no_cache: true}    # `no_cache=true` switches the one-hour cache off
  alternatives:
    - name: Google Light API (`engine=google_light`)
      endpoint: "GET https://serpapi.com/search"
      why_not: >
        A separate, faster engine. Its documentation gives no price of its own, so what it
        costs next to the Google Search API is not stated.
      source: https://serpapi.com/google-light-api
    - name: Google AI Overview API
      why_not: >
        Not a search: a second request that fetches an AI Overview Google loaded separately,
        with a token from the first response.
      source: https://serpapi.com/google-ai-overview-api
  notes: >
    The Google Search API in the default "Best Effort" speed mode. One successful search
    uses one search of the plan, whatever the number of results.

terms:
  url: https://serpapi.com/legal    # read for refunds and service credits only
  benchmarking: unknown             # a clause about benchmarking has not been looked for

auth:
  env: []

capabilities:
  mobile: true                      # `device`
  city_location: true               # `location` at city level, or `uule`
  pagination: true                  # each further page is a separate search
  raw_html: true                    # `output=html`
  ai_overview: true                 # in the response, or behind a `page_token` that lives one minute

billing:
  - effective_from: 2026-11-12
    checked_at: 2026-11-12
    currency: USD
    sources:
      - https://serpapi.com/pricing
      - https://serpapi.com/pricing.md
      - https://serpapi.com/enterprise
      - https://serpapi.com/search-api
      - https://serpapi.com/ludicrous-speed
      - https://serpapi.com/ai-overview
      - https://serpapi.com/google-ai-overview-api
      - https://serpapi.com/blog/understanding-ai-overview-data-from-serpapi/
      - https://serpapi.com/google-light-api
      - https://serpapi.com/api-status-and-error-codes
      - https://serpapi.com/account-api
      - https://serpapi.com/legal
    prices_exclude_tax: unknown

    meter:
      unit: request
      unit_label: search
      # The account has one search allowance, but the pricing page has no sentence saying
      # that every engine draws one search from it.
      shared_across_products: unknown

    request_cost:
      base: 1                       # "responses with 100 results or empty result sets will both count as 1 search"
      rules:
        - when: {ai_overview: true}
          add: 1
          applies: if_returned
          source: https://serpapi.com/blog/understanding-ai-overview-data-from-serpapi/
          notes: >
            Only when Google loads the AI Overview separately: the response then carries a
            `page_token`, and fetching the overview is a second request, "it will count as
            two SerpApi searches". The token expires within one minute. An overview that is
            already in the first response adds nothing, so this is an upper bound.
      stacking: unknown             # one rule only; there is nothing to combine
      per_page: separate_request    # "Pagination queries count as separate searches."
      results_per_charge: null      # the charge is per search, not per number of results
      free_parameters: []
      # No surcharge is stated for a mobile device, a city-level location or search
      # operators, and nothing says they are free either.
      undocumented: [device, location, query_operators]

    charges:
      failed_request:
        charged: false
        how: >-
          "Only successful searches are counted toward your monthly searches. Cached,
          errored, and failed searches are not."
        source: https://serpapi.com/pricing
      timeout: {charged: unknown}
      empty_serp:
        charged: true
        how: '"Note that legitimately empty search queries are counted."'
        source: https://serpapi.com/enterprise
      client_timeout: {charged: unknown}
      client_error: {charged: unknown}
      cached_response:
        charged: false
        how: '"Cached searches are free, and are not counted towards your searches per month."'
        source: https://serpapi.com/search-api
      billed_statuses: unknown      # billing is defined by "successful search", not by HTTP status
      notes: >
        "Searches blocked, errored, or receiving CAPTCHAs are not counted."
        (https://serpapi.com/enterprise). Calls to the Account API are free.

    cache:
      on_by_default: true           # "A cache is served only if the query and all parameters are exactly the same."
      ttl_seconds: 3600             # "Cache expires after 1h."
      bypass: "no_cache=true"
      source: https://serpapi.com/search-api

    usage_reporting:
      response_header: null
      response_field: null          # a per-response "units charged" field is not stated
      account_endpoint: "GET https://serpapi.com/account.json"
      notes: >
        Free of charge. Fields: plan_id, plan_name, plan_monthly_price, plan_renewal_date,
        searches_per_month, plan_searches_left, extra_credits, total_searches_left,
        this_month_usage, this_hour_searches, last_hour_searches,
        account_rate_limit_per_hour (https://serpapi.com/account-api).

    purchase:
      model: subscription           # "Month-to-month. Cancel anytime." No annual option is stated.
      pricing: plan_units
      # Every plan on https://serpapi.com/pricing. `requests_per_hour` is the plan's
      # "throughput": above it the API answers HTTP 429. Up to Infrastructure it is exactly
      # 20% of the monthly searches (arithmetic on the table, not a sentence of SerpApi's),
      # which is what `hourly_share_of_plan: 0.2` records. Searches "reset at the start of
      # the new billing cycle", hence `unused_units: expire`.
      plans:
        - {id: free, name: Free, price: 0, period: month, units: 250, unused_units: expire, on_limit: block,
           limits: {requests_per_hour: 50, hourly_share_of_plan: 0.2}}
        - {id: starter, name: Starter, price: 25, period: month, units: 1000, unused_units: expire,
           limits: {requests_per_hour: 200, hourly_share_of_plan: 0.2}}
        - {id: developer, name: Developer, price: 75, period: month, units: 5000, unused_units: expire,
           limits: {requests_per_hour: 1000, hourly_share_of_plan: 0.2}}
        - {id: production, name: Production, price: 150, period: month, units: 15000, unused_units: expire,
