name: Benchmark run

# Runs the benchmark against real providers, with keys from repository secrets, stores the
# records on the `benchmark-data` branch, and publishes the summary of all records as one
# file on the `benchmark-summary` branch.
#
# On a schedule it wakes up every hour; `serp-bench run --run auto` then does the run that
# fell due recently and is not stored yet (the hours move from day to day, see
# bench.yaml), and does nothing otherwise. GitHub starts a scheduled job tens of minutes
# late, often in the next clock hour, so the run is found by what is owed, not by the hour. Started by hand, it does the next of today's runs that is
# not stored yet, so nobody has to know which ones were done. A run is never done twice.
#
# A schedule fires only from the default branch.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: "Provider ids, comma-separated (empty: the list in bench.yaml)"
        required: false
        default: ""
      run:
        description: "next (the first of today's runs not stored yet), auto (the run due this UTC hour) or a run index"
        required: true
        default: "next"
      limit:
        description: "Send only the first N tasks (empty: the whole run)"
        required: false
        default: ""
      allow_draft:
        description: "Also run providers whose status is draft"
        type: boolean
        default: false
      store:
        description: "Store the records on the benchmark-data branch"
        type: boolean
        default: true

permissions:
  contents: write   # to push records to benchmark-data and the summary to benchmark-summary; nothing else is written
  actions: write    # to start the workflow that publishes the page

# One run at a time: two runs at once would compete for the same provider limits.
concurrency:
  group: benchmark-run
  cancel-in-progress: false


jobs:
  run:
    # The schedule spends real searches on every provider's account, so it stays off until
    # someone turns it on: set the repository variable BENCHMARK_SCHEDULE to `on`
    # (Settings, Secrets and variables, Actions, Variables). Starting a run by hand always works.
    if: github.event_name != 'schedule' || vars.BENCHMARK_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets are passed by name, one line per provider key. Add a line when a provider
      # is added. Values are never printed: the tool redacts them and logs no headers.
      SCRAPEBEAVER_API_KEY: ${{ secrets.SCRAPEBEAVER_API_KEY }}
      SCRAPEBEAVER_BASE_URL: ${{ vars.SCRAPEBEAVER_BASE_URL }}
      DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
      SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
      SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      OXYLABS_API_KEY: ${{ secrets.OXYLABS_API_KEY }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
      SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      # On a schedule there are no inputs: the run due this hour, every task, stored.
      INPUT_PROVIDERS: ${{ inputs.providers }}
      INPUT_RUN: ${{ inputs.run || 'auto' }}
      INPUT_LIMIT: ${{ inputs.limit }}
      INPUT_ALLOW_DRAFT: ${{ inputs.allow_draft }}
      INPUT_STORE: ${{ github.event_name == 'schedule' || inputs.store }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Providers and keys
        run: uv run serp-bench providers
      - name: Runs stored today and yesterday
        # What `auto` and `next` look at, so that a run that is already on the data branch
        # is not done again. Yesterday too: the last run of a day can start after midnight.
        run: |
          mkdir -p stored
          if git fetch --quiet --depth 1 origin benchmark-data 2>/dev/null; then
            for day in "$(date -u -d yesterday +%Y/%m/%d)" "$(date -u +%Y/%m/%d)"; do
              git archive FETCH_HEAD "raw/$day" 2>/dev/null | tar -x -C stored || true
            done
          fi
          find stored -name 'run-*.jsonl.gz' | sort
      - name: Run
        run: |
          args=(run --run "$INPUT_RUN" --stored stored/raw)
          if [ -n "$INPUT_PROVIDERS" ]; then args+=(--providers "$INPUT_PROVIDERS"); fi
          if [ -n "$INPUT_LIMIT" ]; then args+=(--limit "$INPUT_LIMIT"); fi
          if [ "$INPUT_ALLOW_DRAFT" = "true" ]; then args+=(--allow-draft); fi
          uv run serp-bench "${args[@]}"
      - name: Check the records
        # The report must be recomputable from the file alone, before the file is kept.
        run: |
          find out/raw -name 'run-*.jsonl.gz' 2>/dev/null | sort | while IFS= read -r file; do
            uv run serp-bench verify "$file" > /dev/null
            echo "verified: $file"
          done
      - name: Store the records
        id: store
        if: env.INPUT_STORE == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/store_run.sh out benchmark-data origin
      - name: Publish the page
        # Only when this run stored something new: an hour with no run due publishes nothing.
        if: steps.store.outputs.stored == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
      - name: Publish the summary
        # Every figure of the results page as one file, rebuilt from all the records stored
        # so far and put on its own branch, where whoever shows the results reads it.
        if: steps.store.outputs.stored == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          mkdir -p data
          git fetch --quiet --depth 1 origin benchmark-data
          git archive FETCH_HEAD raw | tar -x -C data
          echo "Run files: $(find data/raw -name 'run-*.jsonl.gz' | wc -l)"
          uv run serp-bench site --records data/raw --out dist > /dev/null
          scripts/store_summary.sh dist/summary.json benchmark-summary origin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-${{ github.run_id }}
          path: out/raw/
          retention-days: 30
          if-no-files-found: ignore
