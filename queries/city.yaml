# Searches placed in a city: the "search in a city" feature.
#
# Ten everyday searches that name no place, each placed in five cities: the same words give
# another page in Austin than in Seattle, and the page says which city it was made for.
# Three of the fifty go out each day, one per run, to the providers that offer a place
# below country level. `location` is Google's canonical name of the place; `coordinates`
# are the same place as latitude and longitude, for a provider that takes it that way.
#
# These are not in the main table: not every provider offers the feature. See "Features"
# in the README.
version: 1
description: Searches placed in a city. Three a day, one per run.
queries:
  # --- Austin ---
  - {id: city-austin-city-hall, query: "city hall", country: US, locale: en, category: local, location: "Austin,Texas,United States", coordinates: [30.2672, -97.7431]}
