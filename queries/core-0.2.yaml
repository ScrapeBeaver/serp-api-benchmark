# The core: the searches sent every day, from 2026-11-26.
#
# The same searches every day are what makes one day comparable with the next, and what
# the history check of step 3 needs: a search has a history only if it keeps coming back.
# Thirty-one of these forty are the searches of the list before it (queries/core.yaml, in
# force until 2026-11-25), with their ids, so their records go on without a break. Nine
# were replaced on 2026-11-26, so that the list has what real use has: three searches
# inside one site (`site:`), three for an exact phrase (in quotes), and three longer ones.
# The new ones carry it in their id: -s for a site, -p for a phrase, -l for a long one. A
# little over half of the list is commercial (loans, insurance, software, shopping),
# because that is where poisoning concentrates.
#
# The list is public and fixed. Changing it is a change to the benchmark: add a dated
# line under "Changes to how numbers are computed" in the README when you do.
version: 2
description: The core list. Every search is sent every day.
