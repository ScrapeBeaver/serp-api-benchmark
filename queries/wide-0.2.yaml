# The wide list: the searches that rotate, from 2026-11-26.
#
# A quarter of this list goes out each day, so every search comes back exactly every four
# days. That is as wide as the list can be while the history check of step 3 still works:
# it needs a search on three earlier days within fourteen. Which searches go on which
# day, and in what order, follows from the date alone (see `plan` in
# src/serp_bench/queries.py), so anyone can recompute what was sent on a given day.
#
# 123 of these 160 are the searches of the list before it (queries/wide.yaml, in force until
# 2026-11-25), with their ids. Thirty-seven were replaced on 2026-11-26: twelve searches
# inside one site (`site:`, id -s), twelve for an exact phrase (in quotes, id -p) and
# thirteen longer ones (id -l). Half of the list is commercial.
#
# The list is public. A provider that wanted to treat exactly these searches differently
# could; rotation makes that 200 searches to prepare for instead of 80, not impossible.
