# What is measured, when, and how much.
#
# A pool is a named stream of tasks: where its queries come from, how many are sent per
# day, in which of the day's runs, with which device and results page.
# `serp-bench plan` prints what this file adds up to.

methodology_version: "0.2"

# In force from 00:00 UTC of this day. A run of an earlier day is planned from `previous`,
# so what a day's runs are never changes in the middle of the day.
starts: 2026-11-26
previous: bench-0.1.yaml

# Providers measured by default. `--providers mock` runs the offline mock instead.
providers: [scrapebeaver, decodo, scrapingbee, scrapingdog, brightdata, serper, oxylabs,
            dataforseo, scrapedo, scraperapi, serpapi]

schedule:
  runs_per_day: 3         # evenly spaced, every eight hours; must divide 24
  minute: 17              # past the hour
  rotate_hours: true      # the timetable moves one hour later each day, so every hour
                          # of the day is sampled within 24 / runs_per_day days

# The volume: 80 searches a day per provider for the main table, in three runs, and
# around them the searches that say what the main table cannot.
#
# * `core`: forty searches, every one of them every day. The same searches every day are
#   what makes one day comparable with the next, and they give step 3 its history.
# * `wide`: forty a day out of a list of 160, so every search of it comes back exactly
#   every four days. It keeps the figures from being about forty searches only, and four
#   days is the longest gap at which step 3 still has a history for a search.
# * `deep`: pages 2 to 5 of one core search of the run, asked for in order and never two at
#   a time, the way a person turns pages. Not in the main table: it is what the later-pages
#   half of the repeatability figure is computed from.
# * `week` and `city`: one search each per run for a feature that not every provider
#   offers: only results of the past week (a core search of the run with the filter on),
#   and a search placed in a city. A provider that does not offer the feature is not sent
#   the search. Shown apart on the page, never in the main table.
#
# Which searches of the wide list go on which day, and in what order, follows from the
# date alone, so anyone can recompute what was sent. The hours of the runs move by one
# each day, so every hour of the day is sampled within eight days.
# (Until 2026-11-25: four runs a day, a `page2` pool, no repeats; see bench-0.1.yaml.)
#
# Mobile searches are not measured. Not every provider offers them, so the providers would
# not be compared on the same searches, and the step-3 check would have too few pages of
# the same search to compare. Whether a provider offers them, and at what price, is still
# stated in its provider.yaml and shown on the pricing page.
pools:
  core:
    source: queries/core-0.2.yaml
    per_day: 40                   # the whole list every day, spread evenly over the pool's runs
    runs: all                     # or run indexes, e.g. [0, 2]
    device: desktop
    page: 1
    headline: true                # counts towards the main table
  wide:
    source: queries/wide-0.2.yaml
    per_day: 40                   # a quarter of the list a day: every search every four days
    headline: true
  deep:
    follows: core                 # a search the core pool sends in the same run
    per_run: 1
    pages: [2, 3, 4, 5]
  week:
    follows: core
    per_run: 1
    time_range: week
    feature: week
  city:
    source: queries/city.yaml
    per_day: 3                    # one per run; the whole list every seventeen days
    feature: city

# The same search asked again from the same provider exactly five minutes later: three of
# the run's first pages, and two of the pages of its paged search (pages 2 and 4 in one
# run, 3 and 5 in the next). The repeatability figure is computed from these pairs.
repeats:
  after_seconds: 300
  first_pages: 3
  later_pages: 2

# Money. `serp-bench budget` works out, from each provider's declared prices, the cheapest
# plan that covers a month of the pools above, and fails when one costs more than this.
budget:
  max_usd_per_provider_per_month: 50

limits:
  timeout_seconds: 60
  dispatch_interval_seconds: 15       # one task every 15 s, whether or not answers are back
  stagger_providers: true             # a task goes to one provider after another, 15 s apart,
                                      # in an order drawn anew for every run
  max_in_flight_per_provider: 5       # must exceed timeout / interval, so a slow provider is never skipped
  max_tasks_per_provider_per_run: 60  # requests per provider per run, warm-up and control repeats included
  # Step 3: a first page that matched no other provider's page is asked for once more from
  # the same provider, after the timetable. Three a run is nine a day, the most a day has
  # had so far, and it keeps a month inside the smallest plan a provider is measured on.
  max_control_repeats_per_provider_per_run: 3

# The results page (`serp-bench site`). None of this changes what is measured.
site:
  url: https://benchmark.scrapebeaver.com
  repository: https://github.com/scrapebeaver/serp-api-benchmark   # the public repository, linked from the page
  operator: scrapebeaver    # the provider run by whoever runs this benchmark; marked "us" on the page
  preview: true             # before launch: show every measured provider, say it is a preview,
                            # and ask search engines not to index the page
